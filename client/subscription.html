<!DOCTYPE html>
<html>
<head>
    <title>Subscription Plans</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .plans {
            max-width: 900px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .plan {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .plan h3 {
            font-size: 22px;
        }

        .plan button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        .plan button:hover {
            opacity: 0.8;
        }

        @media (max-width: 700px) {
            .plans {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h2>Choose Your Plan</h2>

    <div class="plans">

        <div class="plan">
            <h3>Free</h3>
            <p>1 Download / Day</p>
            <p>Basic Access</p>

            <button onclick="upgradePlan('Free')">
                Select Free
            </button>
        </div>

        <div class="plan">
            <h3>Bronze</h3>
            <p>3 Downloads / Day</p>
            <p>Premium Access</p>

            <button onclick="upgradePlan('Bronze')">
                Choose Bronze
            </button>
        </div>

        <div class="plan">
            <h3>Silver</h3>
            <p>5 Downloads / Day</p>
            <p>Premium Access</p>

            <button onclick="upgradePlan('Silver')">
                Choose Silver
            </button>
        </div>

        <div class="plan">
            <h3>Gold</h3>
            <p>10 Downloads / Day</p>
            <p>Premium Access</p>

            <button onclick="upgradePlan('Gold')">
                Choose Gold
            </button>
        </div>

    </div>

    <script>

        const email = "ananya@gmail.com";

        async function upgradePlan(plan) {

            try {

                const response = await fetch(
                    "/upgrade-plan",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            plan: plan
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || "Plan update failed");
                    return;
                }

                alert(
                    "Plan Updated Successfully!\n\n" +
                    "Current Plan: " +
                    data.user.plan
                );

            } catch (error) {

                console.error(error);

                alert("Unable to update plan");

            }
        }

    </script>

</body>
</html>
